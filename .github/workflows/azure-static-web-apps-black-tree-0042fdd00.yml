name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verify content before building
      - name: Verify content
        run: node scripts/verify-content.mjs

      # Build the Vite application.
      # This also runs the existing prebuild/prerender process.
      - name: Build
        run: npm run build

      # Verify the generated static output
      - name: Verify build output
        run: node scripts/verify-build.mjs

      # Make sure Azure deploys ONLY the generated dist directory.
      - name: Verify deployment files
        run: |
          echo "Contents of dist:"
          find dist -maxdepth 2 -type f | sort

          echo ""
          echo "Checking required files..."

          test -f dist/index.html
          test -f dist/staticwebapp.config.json

          echo "Required deployment files found."

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_TREE_0042FDD00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          # IMPORTANT:
          # npm run build has already created dist/.
          # Deploy ONLY dist/, not the repository root.
          app_location: "dist"

          # No Azure/Oryx build is required because dist is already built.
          output_location: ""
          skip_app_build: true

          # No API / Azure Functions application.
          api_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_TREE_0042FDD00 }}
          action: close