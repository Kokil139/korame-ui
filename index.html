<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Theme, applied before first paint.

      This is deliberately a blocking inline script. Deciding the theme in
      React instead would let the browser paint the default palette first,
      producing a white flash for dark-mode users on every navigation. It
      also stamps the matching theme-color so the mobile browser chrome
      agrees with the page.
    -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('korame-theme');
                var dark =
                    stored === 'dark' ||
                    ((stored === 'system' || !stored) &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
                var meta = document.createElement('meta');
                meta.name = 'theme-color';
                meta.content = dark ? '#08090d' : '#f7f8fa';
                document.head.appendChild(meta);
            } catch (e) {
                /* Blocked storage — fall through to the light default. */
            }
        })();
    </script>

    <!--

          "acceptedAnswer": {

            "text": "On Scale and Partner engagements, yes — we integrate a headless CMS so you can edit copy, images and pages without touching code. On Launch projects content edits come back to us, which keeps that tier cheaper; you can add a CMS later without a rebuild."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after the site launches?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every engagement includes a support window — 30 days on Launch, 90 on Scale — covering bug fixes and small adjustments. After that you can move to a retainer, or simply own the code outright. There is no lock-in: the repository is yours."
          }
        },

          }
        }
      ]
    }
