<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Theme, applied before first paint.

      This is deliberately a blocking inline script. Deciding the theme in
      React instead would let the browser paint the default palette first,
      producing a white flash for dark-mode users on every navigation. It
      also stamps the matching theme-color so the mobile browser chrome
      agrees with the page.
    -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('korame-theme');
                var dark =
                    stored === 'dark' ||
                    ((stored === 'system' || !stored) &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
                var meta = document.createElement('meta');
                meta.name = 'theme-color';
                meta.content = dark ? '#08090d' : '#f7f8fa';
                document.head.appendChild(meta);
            } catch (e) {
                /* Blocked storage — fall through to the light default. */
            }
        })();
    </script>

    <!--
      ── Per-route head ──────────────────────────────────────────────────
      Everything between these markers is REPLACED for each route by
      scripts/prerender.mjs, using the descriptor <Seo> produced during the
      pre-render pass. Do not add page metadata here: title, description,
      canonical, Open Graph, Twitter and JSON-LD are all generated per route
      from src/lib/seo.js and the content modules.

      What is below is only the dev-server fallback, because `npm run dev`
      serves this file unmodified.
      ───────────────────────────────────────────────────────────────────── -->
    <!--SEO:START-->
    <title>Korame | Web Development, Full-Stack &amp; Software Engineering</title>
    <meta name="description" content="Korame is a software engineering studio building websites, web applications, full-stack systems, custom software and cloud-deployed products." />
    <!--SEO:END-->

    <meta name="author" content="Korame" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>
<body>
<!--
  There is no <noscript> fallback here, and that is deliberate.

  Every route is pre-rendered to complete static HTML, so a visitor with
  JavaScript disabled already gets the whole page — copy, navigation, links
  and all. A <noscript> block would only add a second <h1> to every document,
  which is a heading-hierarchy problem for a page that no longer needs the
  fallback at all.
-->
<div id="root"><!--app-html--></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
